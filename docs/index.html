<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Agent Benchmarks</title>
    <meta
      name="description"
      content="A daily digest of new agent benchmarks appearing on arXiv."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3efe6" />
    <meta property="og:title" content="Daily Agent Benchmarks" />
    <meta
      property="og:description"
      content="New agent benchmarks from arXiv, updated once a day."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead">
      <div class="masthead__brand">
        <a class="wordmark" href="./">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="3" y="6" width="26" height="3" rx="0.5" />
            <rect x="3" y="14.5" width="18" height="3" rx="0.5" />
            <rect x="3" y="23" width="22" height="3" rx="0.5" />
          </svg>
          <span>
            <span class="wordmark__kicker" data-i18n="kicker">arXiv daily</span>
            <span class="wordmark__title" data-i18n="title">Agent Benchmarks</span>
          </span>
        </a>
      </div>
      <form class="search" role="search" id="search-form">
        <label class="sr-only" for="q" data-i18n="searchLabel">Search benchmarks</label>
        <input
          id="q"
          name="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
          data-i18n-placeholder="searchPlaceholder"
          placeholder="Search titles, abstracts, tags…"
        />
        <kbd class="search__hint">/</kbd>
        <label class="exact">
          <input type="checkbox" id="exact-match" />
          <span data-i18n="exactMatch">Exact / cover match</span>
        </label>
      </form>
      <div class="masthead__tools">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="zh" aria-pressed="false">中文</button>
        </div>
        <button type="button" class="theme" id="theme-toggle" data-i18n-aria="themeToggle">
          Toggle theme
        </button>
      </div>
    </header>

    <div class="shell">
      <aside class="rail" id="rail" aria-label="Fields"></aside>
      <main id="main">
        <section class="hero" id="hero"></section>
        <div id="status" class="status" hidden></div>
        <div id="feed" class="feed"></div>
      </main>
    </div>

    <footer class="colophon">
      <p data-i18n="footer">
        Papers are collected from the arXiv API, kept if they look like agent
        benchmarks, and grouped by submission date. Ranked search uses BM25 in
        the browser.
      </p>
      <p class="colophon__meta">
        <span id="generated"></span>
        <span>
          <span data-i18n="visitorsPage">Page views</span>
          <strong id="vercount_value_page_pv">-</strong>
          ·
          <strong id="vercount_value_site_uv">-</strong>
          <span data-i18n="visitorsSite">visitors</span>
        </span>
        <a href="https://arxiv.org" target="_blank" rel="noopener">arXiv.org</a>
      </p>
    </footer>
    <script defer src="https://events.vercount.one/js"></script>

    <script src="./js/i18n.js"></script>
    <script src="./js/bm25.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
