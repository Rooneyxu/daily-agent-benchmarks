<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bio &amp; Medical Benchmarks</title>
    <meta name="description" content="A daily index of new biology, medicine, life-science, protocol, and biosafety benchmarks." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3efe6" />
    <meta property="og:title" content="Bio &amp; Medical Benchmarks" />
    <meta property="og:description" content="New biology and medical benchmark papers, checked daily." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="./css/bio.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead">
      <div class="masthead__brand">
        <a class="wordmark" href="./">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="3" y="6" width="26" height="3" rx="0.5" />
            <rect x="3" y="14.5" width="18" height="3" rx="0.5" />
            <rect x="3" y="23" width="22" height="3" rx="0.5" />
          </svg>
          <span><span class="wordmark__kicker" data-i18n="kicker">Daily index</span><span class="wordmark__title" data-i18n="title">Bio &amp; Medical</span></span>
        </a>
      </div>
      <form class="search" role="search" id="bio-search-form">
        <label class="sr-only" for="bio-q" data-i18n="searchLabel">Search benchmarks</label>
        <input id="bio-q" name="q" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" placeholder="Search titles, abstracts, evidence…" />
        <kbd class="search__hint">/</kbd>
        <label class="exact"><input type="checkbox" id="bio-exact" /><span data-i18n="exactMatch">Exact / cover match</span></label>
      </form>
      <div class="masthead__tools">
        <nav class="site-switch" aria-label="Benchmark collections">
          <a href="../">Agent</a><a href="./" aria-current="page">Bio &amp; Medical</a>
        </nav>
        <a class="github" href="https://github.com/Rooneyxu/daily-agent-benchmarks" target="_blank" rel="noopener" data-i18n-aria="githubAria" aria-label="Open the GitHub repository">GitHub</a>
        <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh" aria-pressed="false">中文</button></div>
        <button type="button" class="theme" id="bio-theme-toggle" data-i18n-aria="themeToggle">Dark</button>
      </div>
    </header>
    <div class="shell">
      <aside class="rail" id="bio-rail" aria-label="Categories"></aside>
      <main id="main">
        <section class="hero" id="bio-hero"></section>
        <div id="bio-status" class="status"></div>
        <div id="bio-feed" class="feed"></div>
      </main>
    </div>
    <footer class="colophon">
      <p data-i18n="footer">Sources are checked daily. Priority labels help navigation but never decide inclusion.</p>
      <p class="colophon__meta"><span id="bio-generated"></span><a href="./data/meta.json">Source status</a><a href="https://github.com/Rooneyxu/daily-agent-benchmarks">GitHub</a></p>
    </footer>
    <script src="./js/i18n.js"></script>
    <script src="../js/bm25.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
