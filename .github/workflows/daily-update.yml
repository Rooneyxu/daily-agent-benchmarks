name: Daily arXiv update

on:
  schedule:
    # arXiv announces new papers Sun–Thu at 20:00 US Eastern.
    # EDT → 00:00 UTC; EST → 01:00 UTC. The API often lags a few minutes.
    # Two slots cover DST and give a second pass if the first run is early.
    # Cron days 1–5 (Mon–Fri UTC) = the night of Sun–Thu ET announcements.
    - cron: "25 0 * * 1-5"
    - cron: "25 1 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and classify new agent benchmarks
        run: python scripts/update.py --days 4

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily agent benchmark index"
            git pull --rebase origin main
            git push
          fi
